<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reloj Analógico Acelerado - Pink Edition</title>
  <!-- Librería p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0d0509;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fce7f3;
      overflow: hidden;
    }
    #controls {
      position: absolute;
      top: 25px;
      background: rgba(30, 10, 20, 0.85);
      padding: 12px 24px;
      border-radius: 30px;
      border: 1px solid rgba(244, 114, 182, 0.3);
      display: flex;
      align-items: center;
      gap: 15px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }
    label {
      font-size: 14px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #f472b6;
    }
    input[type=range] {
      cursor: pointer;
      accent-color: #ec4899;
    }
    #speedVal {
      font-weight: bold;
      color: #f472b6;
      min-width: 45px;
    }
  </style>
</head>
<body>

<div id="controls">
  <label for="speedSlider">Velocidad:</label>
  <input type="range" id="speedSlider" min="1" max="600" value="180" step="1">
  <span id="speedVal">180x</span>
</div>

<script>
let angleSec = 0;
let angleMin = 0;
let angleHour = 0;

let slider;
let speedLabel;

function setup() {
  createCanvas(600, 600);
  angleMode(RADIANS);
  
  slider = document.getElementById('speedSlider');
  speedLabel = document.getElementById('speedVal');
  
  // Sincronización inicial con la hora real local
  let h = hour() % 12;
  let m = minute();
  let s = second();

  angleSec = map(s, 0, 60, 0, TWO_PI);
  angleMin = map(m + s / 60, 0, 60, 0, TWO_PI);
  angleHour = map(h + m / 60 + s / 3600, 0, 12, 0, TWO_PI);
}

function draw() {
  background('#0d0509');
  
  let speedFactor = parseFloat(slider.value);
  speedLabel.innerText = speedFactor + 'x';
  
  let dt = deltaTime / 1000;
  
  // Velocidades angulares proporcionales (vr3, vr2, vr1)
  let vr3 = (TWO_PI / 60) * speedFactor;          // Segundero
  let vr2 = (TWO_PI / 3600) * speedFactor;        // Minutero
  let vr1 = (TWO_PI / 43200) * speedFactor;       // Horario

  // Actualizar ángulos
  angleSec += vr3 * dt;
  angleMin += vr2 * dt;
  angleHour += vr1 * dt;

  translate(width / 2, height / 2);

  // --- 1. ESFERA Y MARCO EN TONOS ROSA Y NEGRO ---
  // Resplandor exterior rosa tenue
  noFill();
  stroke(236, 72, 153, 20);
  strokeWeight(24);
  ellipse(0, 0, 440, 440);

  // Marco exterior (Negro rosado)
  fill('#1a0914');
  stroke('#831843');
  strokeWeight(6);
  ellipse(0, 0, 400, 400);

  // Esfera central (Fondo oscuro profundo)
  fill('#0d0208');
  stroke('#2a0a1f');
  strokeWeight(3);
  ellipse(0, 0, 380, 380);

  // --- 2. MARCAS DEL RELOJ ---
  for (let i = 0; i < 60; i++) {
    let angle = map(i, 0, 60, 0, TWO_PI);
    let x1 = cos(angle) * 170;
    let y1 = sin(angle) * 170;
    
    if (i % 5 === 0) {
      // Indicadores de hora
      let x2 = cos(angle) * 148;
      let y2 = sin(angle) * 148;
      stroke('#f472b6');
      strokeWeight(3);
      line(x1, y1, x2, y2);
    } else {
      // Indicadores de minuto
      let x2 = cos(angle) * 162;
      let y2 = sin(angle) * 162;
      stroke('#500724');
      strokeWeight(1.5);
      line(x1, y1, x2, y2);
    }
  }

  // --- 3. MANECILLA DE HORA (vr1 - Magenta Oscuro / Ancha) ---
  push();
  rotate(angleHour - HALF_PI);
  stroke('#be185d');
  strokeWeight(9);
  strokeCap(ROUND);
  line(-10, 0, 95, 0);
  
  // Detalle interior
  stroke('#9d174d');
  strokeWeight(3);
  line(15, 0, 85, 0);
  pop();

  // --- 4. MANECILLA DE MINUTOS (vr2 - Rosa Neón / Media) ---
  push();
  rotate(angleMin - HALF_PI);
  stroke('#f472b6');
  strokeWeight(5);
  strokeCap(ROUND);
  line(-15, 0, 135, 0);
  
  fill('#f472b6');
  noStroke();
  ellipse(85, 0, 8, 8);
  pop();

  // --- 5. MANECILLA DE SEGUNDOS (vr3 - Blanco Pastel / Delgada) ---
  push();
  rotate(angleSec - HALF_PI);
  stroke('#fdf2f8');
  strokeWeight(2);
  strokeCap(ROUND);
  line(-25, 0, 160, 0);
  
  // Detalles en la punta y contrapeso
  fill('#ec4899');
  noStroke();
  ellipse(125, 0, 7, 7);
  ellipse(-12, 0, 5, 5);
  pop();

  // --- 6. CENTRO DEL RELOJ ---
  fill('#fdf2f8');
  stroke('#831843');
  strokeWeight(2);
  ellipse(0, 0, 16, 16);

  fill('#ec4899');
  noStroke();
  ellipse(0, 0, 6, 6);
}

function windowResized() {
  resizeCanvas(600, 600);
}
</script>

</body>
</html>
